services:
  backend:
    build: ./backend
    command: supervisor -e '.' index.js
    ports:
      - "3000:3000"
    depends_on:
      - mysql
    volumes:
      - ./backend:/src

  frontend:
    environment:
      CHOKIDAR_USEPOLLING: "true"
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/src

  mysql:
    image: mysql:8
    env_file:
      ./.env
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./urbanbotany.sql:/docker-entrypoint-initdb.d/urbanbotany.sql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
    depends_on:
      - mysql

volumes:
  mysql_data:
